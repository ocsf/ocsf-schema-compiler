name: Publish package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Update package version from tag
      run: scripts/update-version.sh src/ocsf_schema_compiler/__init__.py "${{ github.ref_name }}"

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Build release distributions
      run: |
        python -m pip install -U flit
        flit build

    - name: Check package version update
      run: |
        flit install
        # If this fails, something went wrong updating the version
        ocsf-schema-compiler -v

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: release-dists
        path: dist/

  publish-to-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see:
    #   https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    #   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    # This is also relevant, though the "on" condition is different:
    #   https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
